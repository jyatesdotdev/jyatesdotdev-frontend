name: Frontend Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'spa/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spa/package-lock.json

      - name: Install Dependencies
        working-directory: spa
        run: npm ci

      - name: Build
        working-directory: spa
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Deploy to S3
        working-directory: spa
        run: |
          aws s3 sync build/client/ s3://${{ secrets.FRONTEND_BUCKET }}/ --delete

      - name: Trigger Infra Deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: ${{ github.repository_owner }}/jyatesdotdev-infra
          event-type: deploy_frontend
          client-payload: |
            {
              "trigger": "frontend_update"
            }
