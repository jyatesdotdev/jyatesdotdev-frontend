name: Frontend Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'spa/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-e2e-revisions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api_sha: ${{ steps.refs.outputs.api_sha }}
      integration_sha: ${{ steps.refs.outputs.integration_sha }}
    steps:
      - name: Resolve E2E revisions
        id: refs
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_PAT }}
        run: |
          api_sha="$(gh api "repos/${{ github.repository_owner }}/jyatesdotdev-api/commits/main" --jq '.sha')"
          integration_sha="$(gh api "repos/${{ github.repository_owner }}/jyatesdotdev-integration/commits/main" --jq '.sha')"
          echo "api_sha=$api_sha" >> "$GITHUB_OUTPUT"
          echo "integration_sha=$integration_sha" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve-e2e-revisions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Dispatch and wait for exact-revision E2E
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_PAT }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          API_REF: ${{ needs.resolve-e2e-revisions.outputs.api_sha }}
          FRONTEND_REF: ${{ github.sha }}
          INTEGRATION_REF: ${{ needs.resolve-e2e-revisions.outputs.integration_sha }}
        run: |
          correlation_id="frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_title="E2E gate ${correlation_id}"
          integration_repo="${REPOSITORY_OWNER}/jyatesdotdev-integration"

          jq -n \
            --arg correlation_id "$correlation_id" \
            --arg api_ref "$API_REF" \
            --arg frontend_ref "$FRONTEND_REF" \
            --arg integration_ref "$INTEGRATION_REF" \
            '{event_type:"run_e2e",client_payload:{correlation_id:$correlation_id,api_ref:$api_ref,frontend_ref:$frontend_ref,integration_ref:$integration_ref}}' |
            gh api --method POST "repos/${integration_repo}/dispatches" --input -

          deadline=$((SECONDS + 180))
          run_id=""
          while [[ -z "$run_id" && $SECONDS -lt $deadline ]]; do
            run_id="$(gh api "repos/${integration_repo}/actions/runs?event=repository_dispatch&per_page=20" |
              jq -r --arg title "$run_title" '[.workflow_runs[] | select(.display_title == $title) | .id] | first // empty')"
            [[ -n "$run_id" ]] || sleep 3
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::Timed out waiting for the integration workflow to start"
            exit 1
          fi
          gh run watch "$run_id" --repo "$integration_repo" --exit-status

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: spa/package-lock.json

      - name: Install Dependencies
        working-directory: spa
        run: npm ci

      - name: Build
        working-directory: spa
        run: npm run build
        env:
          VITE_RUM_APPLICATION_ID: ${{ vars.VITE_RUM_APPLICATION_ID }}
          VITE_RUM_IDENTITY_POOL_ID: ${{ vars.VITE_RUM_IDENTITY_POOL_ID }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Deploy to S3
        working-directory: spa
        run: |
          # Hash-fingerprinted build assets: safe to cache forever
          aws s3 sync build/client/assets/ s3://${{ secrets.FRONTEND_BUCKET }}/assets/ --delete \
            --cache-control "public, max-age=31536000, immutable"
          # Other static files (images, favicons, feeds): cache for a day;
          # the CloudFront invalidation below handles updates at the edge
          aws s3 sync build/client/ s3://${{ secrets.FRONTEND_BUCKET }}/ --delete \
            --exclude "assets/*" --exclude "*.html" \
            --cache-control "public, max-age=86400"
          # HTML last (after the assets it references exist): always revalidate
          aws s3 sync build/client/ s3://${{ secrets.FRONTEND_BUCKET }}/ --delete \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront Cache
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$invalidation_id"

      - name: Verify deployed revision
        working-directory: spa
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://jyates.dev' }}
        run: |
          expected_asset="$(grep -m 1 -oE 'assets/entry\.client-[^" ]+\.js' build/client/index.html)"
          if [ -z "$expected_asset" ]; then
            echo "::error::Could not identify the built entry asset"
            exit 1
          fi
          deployed_html="$(mktemp)"
          trap 'rm -f "$deployed_html"' EXIT
          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 6 --retry-all-errors --retry-delay 10 \
            --output "$deployed_html" \
            "$SITE_URL/"
          grep -Fq "$expected_asset" "$deployed_html"
